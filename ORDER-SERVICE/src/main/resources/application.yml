server:
  port: 8082

show:
  service:
    base:
      url: http://SHOW-SERVICE/api/v1/shows

user:
  service:
    base:
      url: http://USER-SERVICE/api/v1/users

spring:
  application:
    name: ORDER-SERVICE
  profiles:
    active:
      - dev
  config:
    import:
      - optional:configserver:http://localhost:8888



  datasource:
    url : jdbc:postgresql://localhost:5432/orderdb
    username: postgres
    password: Sukantg#007
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      show-sql: true
      open-in-view: false

